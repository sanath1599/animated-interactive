<title>Animated Technical Interactive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky history rail on the left, one working column on the right; stacks to one column on phones.
   Tokens follow the web app (ember accent on warm neutrals). */
:root {
  --bg: hsl(36 24% 97%); --fg: hsl(24 22% 12%); --card: hsl(36 30% 99%); --card-2: hsl(34 26% 95%);
  --muted: hsl(25 10% 40%); --line: hsl(30 16% 86%); --ember: hsl(22 88% 50%); --ember-ink: hsl(36 30% 99%);
  --mint: hsl(168 64% 34%); --bad: hsl(0 72% 45%); --shadow: hsl(24 30% 20% / .45);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: hsl(24 14% 5%); --fg: hsl(30 18% 94%); --card: hsl(24 14% 7%); --card-2: hsl(24 12% 9%);
  --muted: hsl(30 8% 62%); --line: hsl(24 10% 16%); --ember: hsl(24 96% 60%); --ember-ink: hsl(24 30% 8%);
  --mint: hsl(168 72% 62%); --bad: hsl(6 78% 62%); --shadow: hsl(0 0% 0% / .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: hsl(24 14% 5%); --fg: hsl(30 18% 94%); --card: hsl(24 14% 7%); --card-2: hsl(24 12% 9%);
  --muted: hsl(30 8% 62%); --line: hsl(24 10% 16%); --ember: hsl(24 96% 60%); --ember-ink: hsl(24 30% 8%);
  --mint: hsl(168 72% 62%); --bad: hsl(6 78% 62%); --shadow: hsl(0 0% 0% / .6); color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
* { box-sizing: border-box; }
a { color: var(--ember); }
.app { display: grid; grid-template-columns: 1fr; min-height: 100%; }
@media (min-width: 900px) { .app { grid-template-columns: 16.5rem minmax(0, 1fr); } }
.side { border-bottom: 1px solid var(--line); background: var(--card-2); padding: 14px max(16px, env(safe-area-inset-left, 0px)) 14px max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; align-content: start; }
@media (min-width: 900px) { .side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; border-bottom: 0; border-right: 1px solid var(--line); padding: 18px 16px; grid-template-rows: auto auto auto 1fr; } }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; line-height: 1.15; }
.brand svg { width: 32px; height: 32px; flex: none; }
.recent { display: grid; gap: 4px; overflow: auto; align-content: start; min-height: 0; }
@media (max-width: 899px) { .recent { grid-auto-flow: column; grid-auto-columns: minmax(12rem, 1fr); overflow-x: auto; } }
.hist { text-align: left; font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.hist:hover { background: var(--card); border-color: var(--line); }
.hist-title { font-size: .9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-meta { font: .68rem var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-link { color: var(--muted); padding: 8px 10px; text-decoration: none; } .hist-link:hover { color: var(--ember); }
.steps-list details, .card > details { color: var(--muted); } .card > details summary { cursor: pointer; } .card > details p { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
main { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 60rem; width: 100%; margin: 0 auto; min-width: 0; }
@media (min-width: 900px) { main { padding-block: 34px 80px; padding-left: 40px; padding-right: 40px; } }
.h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.08; margin: 0 0 6px; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
.h1 em, h1 em { font-family: var(--serif); font-weight: 400; font-style: italic; color: var(--ember); }
.eyebrow { font: .74rem var(--mono); color: var(--muted); letter-spacing: .02em; margin: 0 0 4px; }
.muted { color: var(--muted); } .small { font-size: .86rem; } .mono { font-family: var(--mono); font-size: .86em; word-break: break-all; }
.hint { color: var(--muted); font-size: .82rem; margin: 6px 0 0; }
.stack > * + * { margin-top: 18px; } .stack-sm > * + * { margin-top: 10px; } .narrow { max-width: 44rem; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .row.spread { justify-content: space-between; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: inherit; font: 500 .92rem var(--sans); padding: 9px 16px; cursor: pointer; text-decoration: none; transition: border-color .15s, transform .15s; }
.btn:hover { border-color: var(--ember); } .btn:focus-visible, .tab:focus-visible, .repo:focus-visible, .hist:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.btn.primary { background: var(--ember); color: var(--ember-ink); border-color: transparent; box-shadow: 0 8px 24px -10px var(--ember); }
.btn.lg { padding: 12px 22px; font-size: 1rem; } .btn.sm { padding: 5px 12px; font-size: .82rem; } .btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
label { display: block; font-weight: 500; font-size: .9rem; margin-bottom: 6px; }
input:not([type=radio]):not([type=checkbox]):not([type=file]), select, textarea { width: 100%; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--ember); outline-offset: 1px; }
textarea { min-height: 7rem; resize: vertical; }
.radio { display: inline-flex; gap: 8px; align-items: center; font-weight: 400; margin: 0 14px 0 0; }
.notice { border-radius: 12px; padding: 11px 14px; border: 1px solid var(--line); background: var(--card-2); font-size: .92rem; }
.notice.bad { border-color: var(--bad); } .notice.warn { border-color: var(--ember); }
.field-error, .bad-text { color: var(--bad); font-size: .85rem; }
.chip { display: inline-flex; font: .68rem var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { color: var(--mint); border-color: var(--mint); } .chip.warn { color: var(--ember); border-color: var(--ember); } .chip.bad { color: var(--bad); border-color: var(--bad); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); } .dot.ok { background: var(--mint); }
.stepper { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0 0 26px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.stepper li { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.stepper-n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: .7rem var(--mono); background: var(--card-2); }
.stepper li.on { color: var(--fg); border-color: var(--ember); } .stepper li.on .stepper-n { background: var(--ember); color: var(--ember-ink); }
.stepper li.done { color: var(--fg); } .stepper li.done .stepper-n { color: var(--mint); }
.steps-list { margin: 0; padding-left: 1.2rem; display: grid; gap: 10px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 500 .88rem var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.tab.on { color: var(--fg); border-color: var(--ember); background: var(--card); }
.repo-list { display: grid; gap: 6px; max-height: 22rem; overflow: auto; margin-top: 10px; }
.repo { text-align: left; font: inherit; color: inherit; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.repo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .repo.on { border-color: var(--ember); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 18%, transparent); }
.drop { border: 1.5px dashed var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; }
.files { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; } .files li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sticky { position: sticky; bottom: 16px; display: flex; justify-content: flex-end; }
.sticky .btn:not(:disabled) { box-shadow: 0 14px 34px -12px var(--shadow), 0 8px 24px -10px var(--ember); }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.timeline li { display: flex; gap: 10px; align-items: baseline; color: var(--muted); flex-wrap: wrap; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); flex: none; transform: translateY(1px); }
.timeline li.on { color: var(--fg); font-weight: 500; } .timeline li.on .tl-dot { border-color: var(--ember); background: var(--ember); animation: pulse 1.4s infinite; }
.timeline li.done { color: var(--fg); } .timeline li.done .tl-dot { background: var(--mint); border-color: var(--mint); }
.timeline li.bad .tl-dot { background: var(--bad); border-color: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); }
.tile { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; min-width: 0; }
.tile strong { font-weight: 500; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 14px; }
.log summary, details.card summary { cursor: pointer; } .log ol { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; font-size: .88rem; max-height: 18rem; overflow: auto; }
.preview { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; background: #eef0f3; }
.preview iframe { width: 100%; height: 100%; border: 0; display: block; }
.shots { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); margin-top: 12px; }
.shots figure { margin: 0; } .shots img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.report { white-space: pre-wrap; font: .8rem/1.5 var(--mono); overflow-x: auto; margin: 10px 0 0; }
.gate { min-height: 60vh; display: grid; place-items: center; }
.gate-card { max-width: 30rem; text-align: center; display: grid; gap: 12px; justify-items: center; padding: 32px 24px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); }
.gate-card svg { width: 48px; height: 48px; }
.skel { display: grid; gap: 12px; } .skel i { height: 4.5rem; border-radius: 14px; background: var(--card-2); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<template id="logo-tpl"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><defs><linearGradient id="lg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#FDA635"/><stop offset=".55" stop-color="#F26A1B"/><stop offset="1" stop-color="#D4470C"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><path d="M26 19 13 32l13 13" stroke="#FFF8F0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 17.5v28.2l7.1-6.5 4.6 10.4 5.2-2.3-4.5-10.2 9.6-.5L33 17.5Z" fill="#FFF8F0" stroke="#D4470C" stroke-width="1.6" stroke-linejoin="round"/></svg></template>

<div class="app">
  <aside class="side" aria-label="Your demos">
    <div class="brand"><span id="brand-logo"></span><span>Animated Technical<br>Interactive</span></div>
    <button class="btn primary" id="new" type="button">New demo</button>
    <p class="eyebrow">Your demos</p>
    <nav class="recent" id="recent"><p class="small muted">Demos you build appear here once you start.</p></nav>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>
<script>document.getElementById("brand-logo").innerHTML = document.getElementById("logo-tpl").innerHTML;</script>
