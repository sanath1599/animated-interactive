<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How antm works</title>
<style>
/* Presentation chrome for generated decks. The product's own screens live inside
   .pf (product frame) and carry their own transcribed styles; nothing here styles them. */
:root{--dk-bg:#eef0f3;--dk-panel:#fff;--dk-ink:#14161a;--dk-muted:#5b616b;--dk-line:#d9dde3;--dk-accent:#2f62d8;--dk-accent-ink:#fff;--dk-shade:rgba(10,14,22,.55);color-scheme:light}
:root[data-theme="dark"]{--dk-bg:#0f1115;--dk-panel:#181b21;--dk-ink:#eceef2;--dk-muted:#9aa1ad;--dk-line:#2a2f38;--dk-shade:rgba(0,0,0,.62);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--dk-bg);color:var(--dk-ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#dk-viewport{position:fixed;inset:0;overflow:hidden}
#dk-stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:center center;background:var(--dk-bg);overflow:hidden}
.dk-head{position:absolute;left:28px;right:28px;top:18px;height:96px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.dk-eyebrow{font:600 12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dk-accent);margin:0 0 6px}
.dk-title{font-size:28px;line-height:1.15;font-weight:700;margin:0;text-wrap:balance;max-width:900px}
.dk-caption{margin:6px 0 0;color:var(--dk-muted);font-size:14.5px;max-width:900px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dk-note{font-size:11.5px;color:var(--dk-muted);border:1px solid var(--dk-line);background:var(--dk-panel);border-radius:8px;padding:6px 10px;max-width:250px;line-height:1.35}
.dk-body{position:absolute;left:24px;right:24px;top:124px;bottom:70px}
.dk-frame{position:absolute;top:0;bottom:0;left:0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -18px rgba(10,14,22,.35);border:1px solid var(--dk-line)}
.dk-frame.with-steps{right:300px}.dk-frame.full{right:0}
.pf-canvas{position:absolute;left:0;top:0;width:1280px;transform-origin:0 0;overflow:hidden}
.pf{position:relative;width:100%;height:100%;overflow:hidden;color:#14161a;color-scheme:light}
.dk-steps{position:absolute;top:0;right:0;width:284px;display:grid;gap:8px;align-content:start;max-height:100%;overflow:auto}
.dk-steps h3{margin:0 0 2px;font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dk-muted)}
.dk-step{display:grid;grid-template-columns:24px 1fr;gap:10px;text-align:left;border:1px solid var(--dk-line);background:var(--dk-panel);color:inherit;border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;cursor:pointer;line-height:1.35}
.dk-step b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--dk-bg);font-size:12px}
.dk-step.on{border-color:var(--dk-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--dk-accent) 18%,transparent)}
.dk-step.on b{background:var(--dk-accent);color:var(--dk-accent-ink)}
.dk-step-cap{grid-column:2;color:var(--dk-muted);font-size:12.5px;margin-top:2px}
.dk-bar{position:absolute;left:24px;right:24px;bottom:16px;height:40px;display:flex;align-items:center;gap:10px}
.dk-btn{height:38px;border-radius:9px;border:1px solid var(--dk-line);background:var(--dk-panel);color:var(--dk-ink);font:600 14px/1 inherit;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dk-btn:hover{border-color:var(--dk-accent)}.dk-btn:focus-visible,.dk-step:focus-visible{outline:2px solid var(--dk-accent);outline-offset:2px}
.dk-btn.primary{background:var(--dk-accent);color:var(--dk-accent-ink);border-color:transparent}
.dk-btn:disabled{opacity:.45;cursor:default}
.dk-progress{flex:1;height:5px;border-radius:5px;background:var(--dk-line);overflow:hidden}.dk-progress i{display:block;height:100%;background:var(--dk-accent);transition:width .3s}
.dk-count{font:600 13px ui-monospace,Menlo,monospace;color:var(--dk-muted);min-width:96px;text-align:center}
.dk-spot{position:absolute;z-index:50;border-radius:10px;box-shadow:0 0 0 9999px var(--dk-shade),0 0 0 3px var(--dk-accent);pointer-events:none;transition:all .35s cubic-bezier(.2,.7,.2,1)}
.dk-bubble{position:absolute;z-index:51;width:330px;background:var(--dk-panel);color:var(--dk-ink);border-radius:12px;padding:14px 16px;box-shadow:0 20px 40px -12px rgba(0,0,0,.45);font-size:15px;line-height:1.45}
.dk-bubble h4{margin:0 0 4px;font-size:16px}.dk-bubble p{margin:0;color:var(--dk-muted)}
.dk-bubble .dk-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.dk-cover{position:absolute;inset:0;display:grid;align-content:center;justify-items:start;padding:0 110px;gap:18px;background:radial-gradient(900px 500px at 85% 10%,color-mix(in srgb,var(--dk-accent) 16%,transparent),transparent 70%)}
.dk-cover .dk-logo{width:64px;height:64px;display:grid;place-items:center}.dk-cover .dk-logo svg,.dk-cover .dk-logo img{max-width:64px;max-height:64px}
.dk-cover h1{font-size:54px;line-height:1.05;margin:0;max-width:980px;text-wrap:balance;letter-spacing:-.01em}
.dk-cover p{font-size:20px;color:var(--dk-muted);margin:0;max-width:820px}
.dk-cover .dk-byline{font-size:15px;letter-spacing:.02em;margin-top:-6px}
.dk-cover .dk-btn{height:48px;font-size:16px;padding:0 22px}
.dk-points{display:grid;gap:10px;margin:0;padding:0;list-style:none;max-width:1000px}
.dk-points li{background:var(--dk-panel);border:1px solid var(--dk-line);border-radius:10px;padding:10px 14px;font-size:16px}
.dk-points small{display:block;color:var(--dk-muted);font:12px ui-monospace,Menlo,monospace;margin-top:2px}
.dk-figs{display:flex;gap:12px;flex-wrap:wrap}
.dk-fig{background:var(--dk-panel);border:1px solid var(--dk-line);border-radius:12px;padding:12px 16px;min-width:150px}
.dk-fig b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}.dk-fig span{font-size:13px;color:var(--dk-muted)}
.dk-fig small{display:block;font:11px ui-monospace,Menlo,monospace;color:var(--dk-muted);margin-top:4px}
.dk-play-bar{position:absolute;left:0;right:0;top:0;height:40px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow:auto}
.dk-chip{border:1px solid var(--dk-line);background:var(--dk-panel);color:inherit;border-radius:999px;padding:6px 12px;font:600 13px/1 inherit;cursor:pointer;white-space:nowrap}
.dk-chip.on{background:var(--dk-accent);color:var(--dk-accent-ink);border-color:transparent}
.dk-chip{flex:none}
.dk-hint{margin-left:auto;font-size:12.5px;color:var(--dk-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:120px;flex:1 1 0;text-align:right}
.dk-frame.play{top:48px}
.dk-toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:var(--dk-ink);color:var(--dk-bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.dk-toast.on{opacity:1}
.dk-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s}
.dk-slide.on{opacity:1;visibility:visible}
.dk-rotate{display:none}
@media (max-width:560px) and (orientation:portrait){.dk-rotate{display:block;position:fixed;left:12px;right:12px;bottom:12px;background:var(--dk-panel);border:1px solid var(--dk-line);border-radius:10px;padding:8px 12px;font-size:13px;text-align:center;color:var(--dk-muted)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.pf{
  --background: 36 24% 97%; --foreground: 24 22% 12%; --card: 36 30% 99%; --card-2: 34 26% 95%;
  --primary: 22 88% 50%; --primary-foreground: 36 30% 99%;
  --secondary: 30 18% 92%; --muted: 30 14% 93%; --muted-foreground: 25 10% 40%;
  --destructive: 0 72% 45%; --border: 30 16% 86%; --ring: 22 88% 50%;
  --ember: 22 92% 52%; --ember-soft: 32 96% 60%; --plum: 268 42% 58%; --mint: 168 64% 34%;
  --shadow: 24 30% 20%;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Iowan Old Style", "Apple Garamond", Georgia, serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
  --radius: 12px;
}
.pf *{ box-sizing: border-box; }
.pf{ margin: 0; height: 100%; background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.pf a{ color: inherit; cursor: pointer; }
.pf h1, .pf h2, .pf h3, .pf h4{ font-family: var(--serif); font-weight: 400; letter-spacing: -.02em; line-height: 1.08; margin: 0; }
.pf p{ margin: 0; }
.pf .accent{ color: hsl(var(--ember)); font-style: italic; }
.pf .mono{ font-family: var(--mono); }
.pf .muted{ color: hsl(var(--muted-foreground)); }
.pf .small{ font-size: 14px; }
.pf .btn{ display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); color: inherit; font: 500 14.72px var(--sans); padding: 9.92px 18.4px; cursor: pointer; text-decoration: none; transition: transform .15s, border-color .15s, background .15s, box-shadow .15s; }
.pf .btn:hover{ border-color: hsl(var(--ember) / .55); }
.pf .btn.primary{ background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: transparent; box-shadow: 0 6px 22px -8px hsl(var(--ember) / .7), inset 0 1px 0 hsl(0 0% 100% / .25); }
.pf .btn.lg{ padding: 13.6px 24px; font-size: 16px; }
.pf .btn.ghost{ background: transparent; }
.pf .btn.sm{ padding: 6.4px 13.6px; font-size: 13.12px; }
.pf .btn:disabled{ opacity: .5; cursor: not-allowed; }
.pf .chip{ display: inline-flex; align-items: center; gap: 5.6px; font-family: var(--mono); font-size: 11.2px; padding: 2.56px 8.8px; border-radius: 999px; border: 1px solid hsl(var(--border)); background: hsl(var(--secondary)); white-space: nowrap; }
.pf .chip.ok{ color: hsl(var(--mint)); border-color: hsl(var(--mint) / .4); background: hsl(var(--mint) / .08); }
.pf .chip.warn{ color: hsl(var(--ember)); border-color: hsl(var(--ember) / .4); background: hsl(var(--ember) / .08); }
.pf .chip.bad{ color: hsl(var(--destructive)); border-color: hsl(var(--destructive) / .4); }
.pf .dot-live{ display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--ember)); }
.pf .brand{ display: inline-flex; align-items: center; gap: 9.6px; font-family: var(--serif); font-size: 20.8px; text-decoration: none; letter-spacing: -.01em; }
.pf .brand-mark{ width: 28px; height: 28px; flex: none; filter: drop-shadow(0 4px 10px hsl(var(--ember) / .35)); }
.pf .theme-btn{ width: 36px; height: 36px; border-radius: 50%; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); color: inherit; cursor: pointer; display: grid; place-items: center; }
.pf label{ display: block; font-weight: 500; font-size: 14.4px; margin-bottom: 6.4px; }
.pf input[type=text], .pf input[type=search], .pf input[type=url], .pf textarea, .pf .fake-input{ width: 100%; font: inherit; color: inherit; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 13.6px; padding: 11.2px 14.4px; }
.pf textarea{ min-height: 76px; resize: none; }
.pf input:focus, .pf textarea:focus{ outline: none; border-color: hsl(var(--ember)); box-shadow: 0 0 0 4px hsl(var(--ember) / .15); }
.pf .hint{ color: hsl(var(--muted-foreground)); font-size: 13.12px; margin-top: 5.6px; }
.pf .notice{ border-radius: 14.4px; padding: 13.6px 16px; border: 1px solid hsl(var(--border)); background: hsl(var(--secondary)); font-size: 14.72px; }
.pf .row{ display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pf .avatar{ width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 10.88px var(--sans); color: hsl(var(--primary-foreground)); background: linear-gradient(135deg, hsl(var(--plum)), hsl(var(--ember))); }
.pf .dx{ height: 100%; overflow-y: auto; overflow-x: hidden; position: relative; isolation: isolate; scroll-behavior: auto; }
.pf .dx-glow{ position: absolute; inset: 0 0 auto 0; height: 960px; z-index: -1; pointer-events: none;
  background: radial-gradient(1100px 520px at 12% -12%, hsl(var(--ember) / .10), transparent 62%), radial-gradient(800px 480px at 100% 0, hsl(var(--plum) / .06), transparent 60%); }
.pf .dx-top{ position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; height: 68px;
  padding: 0 40px; background: hsl(var(--background) / .9); border-bottom: 1px solid hsl(var(--border) / .7); }
.pf .dx-brand{ display: inline-flex; align-items: center; gap: 9.6px; text-decoration: none; font-family: var(--serif); font-size: 17.6px; letter-spacing: -.01em; min-width: 0; }
.pf .dx-nav{ display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: hsl(var(--secondary) / .8); border: 1px solid hsl(var(--border) / .8); }
.pf .dx-nav a{ position: relative; text-decoration: none; font-size: 14.4px; padding: 6.4px 16px; border-radius: 999px; color: hsl(var(--muted-foreground)); }
.pf .dx-nav a.on{ color: hsl(var(--foreground)); background: hsl(var(--card)); box-shadow: 0 1px 2px hsl(var(--shadow) / .12), 0 6px 16px -10px hsl(var(--shadow) / .4); }
.pf .dx-dot{ position: absolute; top: 5.6px; right: 7.2px; width: 6.4px; height: 6.4px; border-radius: 50%; background: hsl(var(--ember)); }
.pf .dx-acct{ display: flex; align-items: center; justify-content: flex-end; gap: 9.6px; }
.pf .dx-main{ max-width: 1152px; margin: 0 auto; padding: 48px 40px 80px; display: grid; gap: 48px; }
.pf .dx-hero{ display: grid; gap: 9.6px; max-width: 704px; }
.pf .dx-hero h1{ font-size: 54.4px; }
.pf .dx-hero-row{ max-width: none; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.pf .dx-hero-row > div:first-child{ display: grid; gap: 9.6px; max-width: 640px; }
.pf .dx-lede{ color: hsl(var(--muted-foreground)); font-size: 16.8px; max-width: 640px; }
.pf .dx-h2{ font-size: 30.4px; }
.pf .dx-panel-open{ display: grid; gap: 9.6px; }
.pf .nd-tabs{ display: flex; flex-wrap: wrap; gap: 6.4px; }
.pf .nd-tabs button{ font: inherit; font-size: 14.08px; padding: 7.2px 14.4px; border-radius: 999px; border: 1px solid hsl(var(--border)); background: transparent; color: hsl(var(--muted-foreground)); cursor: pointer; }
.pf .nd-tabs button.on{ color: hsl(var(--foreground)); background: hsl(var(--ember) / .1); border-color: hsl(var(--ember) / .55); }
.pf.sl-landing .lp{ --background: 0 0% 100%; --foreground: 222 13% 10%; --card: 0 0% 100%; --card-2: 220 14% 96%; --secondary: 220 14% 96%;
  --muted-foreground: 222 8% 39%; --border: 220 13% 90%; --primary: 21 81% 51%; --primary-foreground: 0 0% 100%;
  --display: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
  position: relative; height: 100%; overflow-y: auto; overflow-x: hidden; background: hsl(var(--background)); color: hsl(var(--foreground)); }
.pf.sl-landing .lp h1{ font-family: var(--display); font-weight: 800; }
.pf.sl-landing .lp .brand{ display: inline-flex; align-items: center; gap: 9.6px; font: 700 19.2px var(--display); letter-spacing: -.02em; text-decoration: none; color: inherit; }
.pf.sl-landing .lp .brand-mark{ width: 25.6px; height: 25.6px; }
.pf.sl-landing .lp .btn{ border-radius: 8.8px; font-weight: 500; }
.pf.sl-landing .lp .btn.primary{ box-shadow: none; }
.pf.sl-landing .lp .btn.lg{ padding: 12.48px 20.8px; font-size: 16px; }
.pf.sl-landing .lp .theme-btn{ border-radius: 8px; }
.pf.sl-landing .ln{ position: relative; background: hsl(var(--background)); border-bottom: 1px solid hsl(var(--border)); }
.pf.sl-landing .ln-in{ max-width: 1216px; margin: 0 auto; padding: 11.2px 20px; display: flex; align-items: center; gap: 32px; }
.pf.sl-landing .ln-links{ display: flex; gap: 24px; font-size: 14.72px; color: hsl(var(--muted-foreground)); }
.pf.sl-landing .ln-links a{ cursor: pointer; }
.pf.sl-landing .ln-end{ margin-left: auto; display: flex; align-items: center; gap: 6.4px; }
.pf.sl-landing .ln-signin{ font-size: 14.72px; color: hsl(var(--muted-foreground)); padding: 0 9.6px; cursor: pointer; }
.pf.sl-landing main{ max-width: 1216px; margin: 0 auto; padding: 0 20px; }
.pf.sl-landing .hero{ padding: 44px 0 32px; }
.pf.sl-landing .hero-head{ display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px 64px; align-items: end; margin-bottom: 32px; }
.pf.sl-landing .hero h1{ font-size: 65.6px; line-height: .98; letter-spacing: -.045em; max-width: 12ch; }
.pf.sl-landing .lede{ font-size: 17.28px; line-height: 1.55; color: hsl(var(--muted-foreground)); max-width: 544px; }
.pf.sl-landing .hero-cta{ margin: 20.8px 0 16px; gap: 9.6px; }
.pf.sl-landing .works{ display: flex; flex-wrap: wrap; align-items: center; gap: 5.6px; color: hsl(var(--muted-foreground)); }
.pf.sl-landing .works span{ display: inline-flex; align-items: center; gap: 4.8px; white-space: nowrap; }
.pf.sl-landing .works .ai-icon{ width: 16px; height: 16px; }
.pf.sl-landing .stage{ margin: 0; }
.pf.sl-landing .stage-bar{ display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; border-bottom: 1px solid hsl(var(--border)); }
.pf.sl-landing .stage-tabs{ display: flex; gap: 4px; }
.pf.sl-landing .stage-tabs button{ display: grid; gap: 1.6px; text-align: left; padding: 8.8px 14.4px 11.2px; border: 0; background: none; color: hsl(var(--muted-foreground)); font: 500 15.2px var(--sans); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.pf.sl-landing .stage-tabs button .mono{ font-size: 11.2px; font-weight: 400; }
.pf.sl-landing .stage-tabs button[aria-selected="true"]{ color: hsl(var(--foreground)); border-bottom-color: hsl(var(--foreground)); }
.pf.sl-landing .stage-full{ padding-bottom: 12px; color: hsl(var(--muted-foreground)); cursor: pointer; }
.pf.sl-landing .stage-screen{ position: relative; aspect-ratio: 16 / 9; overflow: hidden; margin-top: 20px; border-radius: 12px; border: 1px solid hsl(var(--border)); box-shadow: 0 30px 60px -30px hsl(222 30% 15% / .35); }
.pf.sl-landing .stage figcaption{ margin-top: 14.4px; color: hsl(var(--muted-foreground)); max-width: 736px; }
.pf.sl-landing .mini{ position: absolute; inset: 0; background: #eef0f3; color: #14161a; font-family: system-ui, -apple-system, sans-serif; }
.pf.sl-landing .mini-cover{ position: absolute; inset: 0 0 54.4px 0; display: grid; align-content: center; justify-items: start; gap: 14.4px; padding: 0 80px;
  background: radial-gradient(620px 360px at 85% 10%, color-mix(in srgb, var(--mini-acc, #e8692c) 16%, transparent), transparent 70%); }
.pf.sl-landing .mini-eb{ font: 600 12.48px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: #5b616b; }
.pf.sl-landing .mini-h{ font-size: 46.4px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; max-width: 640px; }
.pf.sl-landing .mini-p{ font-size: 16.8px; color: #5b616b; max-width: 608px; }
.pf.sl-landing .mini-btn{ font: 600 14.4px system-ui, sans-serif; padding: 8.8px 17.6px; border-radius: 8px; background: var(--mini-acc, #e8692c); color: #fff; }
.pf.sl-landing .mini-bar{ position: absolute; left: 16px; right: 16px; bottom: 12.8px; display: flex; align-items: center; gap: 9.6px; }
.pf.sl-landing .mini-b{ font: 600 11.84px system-ui, sans-serif; padding: 6.4px 11.2px; border-radius: 6.4px; border: 1px solid #d9dde3; background: #fff; }
.pf.sl-landing .mini-b.pri{ background: var(--mini-acc, #e8692c); color: #fff; border-color: transparent; }
.pf.sl-landing .mini-prog{ flex: 1; height: 3px; border-radius: 3px; background: #d9dde3; overflow: hidden; }
.pf.sl-landing .mini-prog i{ display: block; width: 10%; height: 100%; background: var(--mini-acc, #e8692c); }
.pf.sl-landing .mini-c{ font: 600 11.52px ui-monospace, Menlo, monospace; color: #5b616b; }
.pf.sl-setup .dx-steps{ list-style: none; padding: 0; margin: 0; display: grid; max-width: 736px; }

    if (sl.eyebrow) c.appendChild(txt("p", "dk-eyebrow", sl.eyebrow));
    c.appendChild(txt("h1", "", sl.title));
    c.appendChild(txt("p", "", sl.caption));
    if (D.byline) c.appendChild(txt("p", "dk-byline", D.byline));
    var go = txt("button", "dk-btn primary", "Start"); go.id = "dk-start"; go.onclick = function () { goTo(cur.s + 1, 0); };
    c.appendChild(go); node.appendChild(c); return {};
  }

  function buildClose(sl, node) {
    var c = el("div", "dk-cover"); c.style.gap = "16px";
    if (sl.eyebrow) c.appendChild(txt("p", "dk-eyebrow", sl.eyebrow));
    c.appendChild(txt("h1", "", sl.title));
    if (sl.caption) c.appendChild(txt("p", "", sl.caption));
    if (sl.figures && sl.figures.length) {
      var f = el("div", "dk-figs");
      sl.figures.forEach(function (x) {
        var t = el("div", "dk-fig"), b = txt("b", "", x.value);
        if (/^\d+(\.\d+)?$/.test(String(x.value))) { b.dataset.count = String(x.value); b.textContent = reduce ? String(x.value) : "0"; }
        t.appendChild(b); t.appendChild(txt("span", "", x.label)); if (x.source) t.appendChild(txt("small", "", x.source)); f.appendChild(t);
      });
      c.appendChild(f);
    }
    if (sl.points && sl.points.length) {
      var ul = el("ul", "dk-points");
      sl.points.forEach(function (p) { var li = txt("li", "", p.text); if (p.source) li.appendChild(txt("small", "", p.source)); ul.appendChild(li); });
      c.appendChild(ul);
    }
    node.appendChild(c); return {};
  }

  function buildScreen(sl, node) {
    var cap = header(sl, node);
    var body = el("div", "dk-body"); node.appendChild(body);
    var tour = sl.kind === "overview";
    var frame = el("div", "dk-frame " + (tour ? "full" : "with-steps")); body.appendChild(frame);
    var list = null;
    if (!tour) {
      list = el("div", "dk-steps"); list.appendChild(txt("h3", "", "Steps"));
      (sl.steps || []).forEach(function (st, i) {
        var b = el("button", "dk-step"); b.type = "button";
        b.appendChild(txt("b", "", i + 1)); b.appendChild(txt("span", "", st.title));
        b.onclick = function () { goTo(slides.indexOf(sl), i); };
        list.appendChild(b);
      });
      body.appendChild(list);
    }
    var scr = mountScreen(frame, sl.id, "present");
    return {
      fit: scr.fit,
      apply: function (n) {
        scr.fit(); scr.api.setStep(n);
        var st = (sl.steps || [])[n] || {};
        var bubble = tour || !!st.spotlight;
        // With a bubble the step text lives in the bubble; the header keeps the slide's own caption.
        cap.textContent = (bubble ? sl.caption : st.caption) || sl.caption || st.caption || "";
        fitText(cap, 14.5, 12);
        if (list) { var bs = list.querySelectorAll(".dk-step"); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", i === n); }
        var total = stepsOf(sl);
        if (bubble) spot(scr, frame, st.spotlight, st, n, total, function () { next(); }, function () { prev(); });
        else clearSpot(frame);
      }
    };
  }

  function buildPlay(sl, node) {
    header(sl, node);
    var body = el("div", "dk-body"); node.appendChild(body);
    var bar = el("div", "dk-play-bar"); body.appendChild(bar);
    var frame = el("div", "dk-frame full play"); body.appendChild(frame);
    var screens = D.playScreens || [];
    function show(id) {
      frame.innerHTML = ""; playScreen = mountScreen(frame, id, "play");
      var src = slides.filter(function (x) { return x.id === id; })[0];
      if (src && src.steps && src.steps.length) playScreen.api.setStep(src.steps.length - 1);
      var cs = bar.querySelectorAll(".dk-chip"); for (var i = 0; i < cs.length; i++) cs[i].classList.toggle("on", cs[i].dataset.id === id);
    }
    screens.forEach(function (s) { var c = txt("button", "dk-chip", s.label); c.type = "button"; c.dataset.id = s.id; c.onclick = function () { show(s.id); }; bar.appendChild(c); });
    var hint = txt("span", "dk-hint", sl.hint || "Everything here works offline with sample data."); hint.title = hint.textContent; bar.appendChild(hint);
    var first = false;
    return { fit: function () { if (playScreen) playScreen.fit(); }, apply: function () { if (!first && screens[0]) { first = true; show(screens[0].id); } else if (playScreen) playScreen.fit(); } };
  }

  function build(i) {
    if (built[i]) return built[i];
    var sl = slides[i], node = el("section", "dk-slide"); node.dataset.slide = String(i); node.setAttribute("aria-label", sl.title);
    stage.insertBefore(node, document.getElementById("dk-bar"));
    var b = sl.kind === "welcome" ? buildWelcome(sl, node) : sl.kind === "close" ? buildClose(sl, node) : sl.kind === "play" ? buildPlay(sl, node) : buildScreen(sl, node);
    b.node = node; built[i] = b; return b;
  }

  /* ---------- navigation ---------- */
  var total = slides.reduce(function (a, s) { return a + stepsOf(s); }, 0);
  function flatIndex(s, n) { var k = 0; for (var i = 0; i < s; i++) k += stepsOf(slides[i]); return k + n; }
  var bBack = document.getElementById("dk-back"), bNext = document.getElementById("dk-next"), prog = document.querySelector(".dk-progress i"), cnt = document.getElementById("dk-count");

  function countUp(node) {
    var els = node.querySelectorAll("[data-count]");
    for (var i = 0; i < els.length; i++) (function (e) {
      var to = parseFloat(e.dataset.count), dec = (e.dataset.count.split(".")[1] || "").length;
      if (reduce) { e.textContent = e.dataset.count; return; }
      var t0 = performance.now();
      function tick(t) { var p = Math.min(1, (t - t0) / 1200); e.textContent = (to * (1 - Math.pow(1 - p, 3))).toFixed(dec); if (p < 1) requestAnimationFrame(tick); }
      requestAnimationFrame(tick);
      setTimeout(function () { e.textContent = e.dataset.count; }, 1600); // finishes even when timers are throttled
    })(els[i]);
  }

  function goTo(s, n, quiet) {
    s = Math.max(0, Math.min(slides.length - 1, s)); n = Math.max(0, Math.min(stepsOf(slides[s]) - 1, n || 0));
    var changed = s !== cur.s || !built[s];
    cur = { s: s, n: n };
    var b = build(s);
    for (var k in built) built[k].node.classList.toggle("on", +k === s);
    if (b.apply) b.apply(n);
    if (changed) countUp(b.node);
    var f = flatIndex(s, n);
    bBack.disabled = f === 0; bNext.disabled = f === total - 1;
    prog.style.width = ((f + 1) / total * 100) + "%";
    cnt.textContent = (s + 1) + " / " + slides.length + (stepsOf(slides[s]) > 1 ? " · " + (n + 1) + "/" + stepsOf(slides[s]) : "");
    if (!quiet) {
      var h = "#" + (s + 1) + "." + (n + 1) + "&v=" + slug(slides[s]);
      try { history.replaceState(null, "", h); } catch { /* sandboxed */ }
    }
  }
  function next() { var sl = slides[cur.s]; if (cur.n < stepsOf(sl) - 1) goTo(cur.s, cur.n + 1); else if (cur.s < slides.length - 1) goTo(cur.s + 1, 0); }
  function prev() { if (cur.n > 0) goTo(cur.s, cur.n - 1); else if (cur.s > 0) goTo(cur.s - 1, stepsOf(slides[cur.s - 1]) - 1); }
  bNext.onclick = next; bBack.onclick = prev;

  function toggleFs() {
    if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen().catch(function () {}); }
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  }
  document.getElementById("dk-fs").onclick = toggleFs;

  var tEl = null, tTimer = null;
  function toast(msg) { if (!tEl) { tEl = el("div", "dk-toast"); stage.appendChild(tEl); } tEl.textContent = msg; tEl.classList.add("on"); clearTimeout(tTimer); tTimer = setTimeout(function () { tEl.classList.remove("on"); }, 1800); }

  function typing(e) { var t = e.target; return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); }
  addEventListener("keydown", function (e) {
    if (typing(e) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
    else if (e.key === "f" || e.key === "F") toggleFs();
    else if (e.key === "Escape" && document.fullscreenElement) document.exitFullscreen().catch(function () {});
  });
  var tx = null, ty = null;
  stage.addEventListener("touchstart", function (e) { if (e.target.closest && e.target.closest(".pf")) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (tx == null) return; var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) next(); else prev(); }
  }, { passive: true });

  function scale() {
    var vw = innerWidth, vh = innerHeight, k = Math.min(vw / 1280, vh / 720);
    stage.style.transform = "translate(-50%,-50%) scale(" + k + ")";
    for (var i in built) if (built[i].fit) built[i].fit();
  }
  addEventListener("resize", scale);

  function parseHash() {
    var h = location.hash.replace(/^#/, ""), m = /^(\d+)(?:\.(\d+))?/.exec(h);
    if (!m) return { s: 0, n: 0 };
    return { s: (+m[1] || 1) - 1, n: (+m[2] || 1) - 1 };
  }
  addEventListener("hashchange", function () { var p = parseHash(); goTo(p.s, p.n, true); });

  /* ---------- verification hook ---------- */
  function describe(e) {
    var p = []; var n = e;
    for (var i = 0; n && n !== stage && i < 4; i++, n = n.parentElement) p.unshift(n.tagName.toLowerCase() + (n.className && typeof n.className === "string" ? "." + n.className.trim().split(/\s+/).slice(0, 2).join(".") : ""));
    return p.join(" > ") + ' "' + (e.textContent || "").trim().slice(0, 40) + '"';
  }
  function check() {
    var node = built[cur.s] && built[cur.s].node, out = { clipped: [], outside: [] };
    if (!node) return out;
    var sr = stage.getBoundingClientRect(), k = sr.width / 1280;
    var chrome = node.querySelectorAll(".dk-title,.dk-caption,.dk-eyebrow,.dk-step,.dk-note,.dk-points li,.dk-fig,.dk-cover h1,.dk-cover p,.dk-bubble");
    for (var i = 0; i < chrome.length; i++) {
      var e = chrome[i], r = e.getBoundingClientRect();
      if (!r.width) continue;
      if (e.classList.contains("dk-caption")) { if (e.scrollHeight > e.clientHeight + 2) out.clipped.push(describe(e)); }
      else if (e.scrollWidth > e.clientWidth + 2 && getComputedStyle(e).overflowX !== "visible") out.clipped.push(describe(e));
      if (r.right > sr.right + 1 || r.bottom > sr.bottom + 1 || r.left < sr.left - 1 || r.top < sr.top - 1) out.outside.push(describe(e));
    }
    var pf = node.querySelector(".pf");
    if (pf) {
      var texts = pf.querySelectorAll("h1,h2,h3,h4,button,th,td,label,a,span,p,li");
      var pr = pf.getBoundingClientRect();
      for (var j = 0; j < texts.length && out.clipped.length < 25; j++) {
        var t = texts[j], cs = getComputedStyle(t);
        if (!t.offsetParent || !t.textContent.trim()) continue;
        if (t.scrollWidth > t.clientWidth + 2 && (cs.overflowX === "hidden" || cs.overflowX === "clip") && cs.textOverflow !== "ellipsis" && t.children.length === 0) out.clipped.push("product " + describe(t));
        var tr = t.getBoundingClientRect();
        if (tr.width && (tr.right > pr.right + 2 || tr.left < pr.left - 2) && t.children.length === 0) out.outside.push("product " + describe(t));
      }
    }
    if (k <= 0) out.outside.push("stage not laid out");
    return out;
  }

  window.__deck = {
    ready: false,
    slides: slides.map(function (s) { return { id: s.id, kind: s.kind, steps: stepsOf(s) }; }),
    position: function () { return [cur.s + 1, cur.n + 1]; },
    go: function (s, n) { goTo(s - 1, (n || 1) - 1); },
    check: check
  };

  scale();
  var p0 = parseHash();
  goTo(p0.s, p0.n, true);
  requestAnimationFrame(function () { scale(); goTo(cur.s, cur.n, true); window.__deck.ready = true; });
})();

</script>
</body></html>
