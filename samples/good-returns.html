  :`<div class="pgf"><p class="sm" style="color:#6b7280">Showing ${a} – ${b} of ${total} ${word}</p><div class="flex g2"><button class="btn btn-secondary" data-a="pg" data-k="${key}" data-d="-1" ${p===1?'disabled':''}>Previous</button><button class="btn btn-secondary" data-a="pg" data-k="${key}" data-d="1" ${p===tp?'disabled':''}>Next</button></div></div>`}
