 <div class="grid grid-cols-1 md-grid2 xl-grid3 gap-4">${a.map(m=>mcard(m,m.tags.length?`<div class="abs flex fw gap-1 je" style="top:8px;right:8px;max-width:60%">${m.tags.slice(0,3).map(x=>{const c=tagColor(x);return `<span class="iflex ic-c r-full b t-10" style="padding:0 6px;background:${c.bg};border-color:${c.border};color:${c.text}">${esc(x)}</span>`}).join('')}${m.tags.length>3?`<span class="t-10 text-muted-foreground">+${m.tags.length-3}</span>`:''}</div>`:'')).join('')}</div>`}

function meetSide(){const t=S.mt,pool={};M.forEach(m=>m.tags.forEach(x=>pool[x]=(pool[x]||0)+1));const tags=Object.keys(pool).sort((a,b)=>pool[b]-pool[a]||a.localeCompare(b));

 <div class="r-lg b bg-card p-4 space-y-2" id="mt-tags"><div class="flex ic-c jb text-xs"><span class="font-medium iflex ic-c gap-1">${ic('tag',14)} Tags</span>${t.tags.length?'<button type="button" class="text-muted-foreground lnk" data-a="mttclr">Clear</button>':''}</div>
 <div class="flex fw gap-1_5">${tags.map(x=>{const c=tagColor(x),on=t.tags.includes(x);return `<button type="button" class="tagchip" data-a="mttag" data-v="${esc(x)}" style="background:${c.bg};border-color:${c.border};color:${c.text};${on?'box-shadow:0 0 0 2px hsl(var(--foreground)/.4)':''}">${esc(x)}<span style="opacity:.6">${pool[x]}</span></button>`}).join('')}</div></div>
 ${(t.q||t.tags.length||t.from||t.to||t.rag)?'<button type="button" class="btn btn-outline sz-sm wfull" data-a="mtclear">Clear all filters</button>':''}`}
function pMeetings(){const t=S.mt;
 return `<div class="space-y-5"><div class="flex ic-e jb fw gap-3"><div><a class="text-xs text-muted-foreground lnk iflex ic-c gap-1 mb-2" data-a="nav" data-v="dashboard">${ic('arrow-left',12)} Dashboard</a><h1 class="text-2xl font-semibold tracking-tight">All meetings</h1><p class="text-sm text-muted-foreground mt-1">Search, filter, and explore everything you've recorded.</p></div><a class="btn btn-default" data-a="nav" data-v="new">${ic('plus',16)} New meeting</a></div>

function fileRow(f,i,kind,vtt){return `<div class="r-md b bg-muted-30 p-3 text-sm flex ic-c jb gap-3"><div class="truncate"><div class="font-medium truncate">${kind==='part'&&S.nm.files.length>1?`<span class="text-muted-foreground mr-1">Part ${i+1}:</span>`:''}${esc(f.name)}</div><div class="text-xs text-muted-foreground">${fmtBytes(f.size)} · ${vtt?'VTT transcript':esc(f.type||(kind==='video'?'video':'audio'))}</div></div><button type="button" class="text-muted-foreground sh0 lnk" style="--h:1" data-a="nrm" data-v="${kind}:${i}" aria-label="Remove">${ic('x',16)}</button></div>`}
function nmPanel(){const n=S.nm;
 if(n.tab==='upload')return `<div class="space-y-3"><div class="dropzone" data-a="npick" data-v="audio"><div class="iconcircle">${ic('cloud-up',20,'text-muted-foreground')}</div><div class="font-medium">Drag &amp; drop audio file(s)</div><div class="text-sm text-muted-foreground mt-1">or click to choose · add multiple parts to split a long meeting · MP3, WAV, M4A, AAC, OGG, FLAC, WebM</div><div class="text-xs text-muted-foreground mt-2">Max 500 MB total</div></div>
 ${n.files.length?`<div class="space-y-2">${n.files.map((f,i)=>fileRow(f,i,'part')).join('')}${n.files.length>1?`<div class="text-xs text-muted-foreground">${n.files.length} parts · ${fmtBytes(n.files.reduce((s,f)=>s+f.size,0))} total — transcribed in order and merged into one meeting.</div>`:''}</div>`:''}</div>`;
 if(n.tab==='record')return `<div class="r-lg b bg-card p-6"><div class="flex fcol ic-c gap-4"><div class="flex ic-c jc gap-1" style="height:4rem" aria-hidden="true">${Array.from({length:32},()=>'<div class="r-full bg-foreground" style="width:4px;height:2%;opacity:.35"></div>').join('')}</div><div class="font-mono tabular text-3xl" style="font-variant-numeric:tabular-nums">0:00</div><div class="r-full ovh bg-muted wfull max-w-sm" style="height:4px"><div class="hfull bg-foreground" style="width:0%"></div></div><div class="flex ic-c gap-2 mt-2"><button type="button" class="btn btn-default sz-lg r-full" data-a="nrec" style="width:3.5rem;height:3.5rem;padding:0" aria-label="Start recording">${ic('mic',20)}</button></div></div></div>`;
 return `<div class="space-y-3"><div class="dropzone" data-a="npick" data-v="video"><div class="iconcircle">${ic('video',20,'text-muted-foreground')}</div><div class="font-medium">Drop a Teams / meeting video</div><div class="text-sm text-muted-foreground mt-1">MP4, MOV, WebM, MKV · we'll extract the audio and delete the video when done</div><div class="text-xs text-muted-foreground mt-2">Max 500 MB</div></div>
 ${n.video?fileRow(n.video,0,'video'):''}<div class="pt-2"><div class="text-xs font-medium uppercase tracking-wide text-muted-foreground mb-2 flex ic-c gap-1_5">${ic('sparkles',14)} Optional: Teams transcript</div><div class="dropzone sm" data-a="npick" data-v="vtt">${ic('file-text',16,'mx-auto text-muted-foreground mb-1_5')}<div class="text-sm">Drop the Teams .vtt transcript here</div><div class="text-xs text-muted-foreground mt-1">We'll use it directly and skip re-transcription — faster and free.</div></div></div>${n.vtt?fileRow(n.vtt,0,'vtt',1):''}</div>`}
function pNew(){const n=S.nm,has=n.tab==='video'?!!n.video:n.files.length>0;
 const field=(l,h,k,v)=>`<div><label class="label mb-1 block">${l}</label><p class="text-xs text-muted-foreground mb-2">${h}</p><input class="inp" data-i="nm.f.${k}" value="${esc(v)}"></div>`;
 return `<div class="space-y-6 max-w-3xl mx-auto"><div id="nm-head"><h1 class="text-2xl font-semibold tracking-tight">New meeting</h1><p class="text-sm text-muted-foreground" style="margin-top:2px">Upload an audio file or record one straight in your browser. We'll transcribe and analyze it.</p></div>
 <div class="space-y-5"><div id="nm-title"><label class="label" for="title">Title <span class="font-normal text-muted-foreground">(optional)</span></label><input id="title" class="inp mt-1" data-i="nm.title" placeholder="Leave blank — we'll generate one from the transcript" value="${esc(n.title)}"></div>
 <div id="nm-tabs"><div class="tabs-list wfull max-w-md" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))" role="tablist">${[['upload','cloud-up','Upload'],['record','mic','Record'],['video','video','Video']].map(([k,i,l])=>`<button type="button" role="tab" class="tab" aria-selected="${n.tab===k}" data-a="ntab" data-v="${k}">${ic(i,16,'mr-1_5')} ${l}</button>`).join('')}</div><div style="margin-top:.75rem">${nmPanel()}</div></div>
 ${has?`<p class="text-xs text-muted-foreground">Recorded at <time>${fDateTime(NOW)}</time></p>`:''}
 <div class="r-lg b bg-card" id="nm-adv"><button type="button" class="wfull flex ic-c jb text-sm font-medium" style="padding:14px 20px" data-a="nadv"><span>Advanced features</span>${ic('chevron-down',16,'')}</button>
 ${n.adv?`<div class="bt grid grid-cols-1 md-cols2 gap-4" style="padding:16px 20px 20px">${field('Key terms','Comma-separated terms to boost recognition (names, products, acronyms).','kt',n.f.kt)}${field('Known values','Hints for entities the model should preserve.','kv',n.f.kv)}
 ${togg('sd','Speaker diarization','Detect who said what.')}${togg('sl','Speaker labels','Editable A/B/C labels.')}${togg('si','Speaker ID','Persistent IDs per speaker.')}${togg('st','Speaker type','Tag role/type per speaker.')}
 <div><label class="label mb-1 block">Speakers expected</label><input class="inp" type="number" min="1" max="20" data-i="nm.f.spk" value="${esc(n.f.spk)}"></div>${togg('mc','Multichannel audio','Separate channels per speaker.')}
 ${togg('su','Speech understanding','Chapters + auto categorization.')}${togg('td','Topic detection','IAB topic taxonomy.')}${togg('sm','Summarization (AAI)','Native bullet summary from AssemblyAI.')}${togg('sa','Sentiment analysis','Per-sentence sentiment.')}

 <div class="flex ic-c je gap-3 pt-2" id="nm-foot"><button type="button" class="btn btn-default sz-lg" data-a="ncreate" ${has?'':'disabled'}>Create meeting</button></div></div></div>`}

function ents(m){const g={Person:[],Topic:[],Project:[],Organization:[]};m.ent.forEach(([k,n])=>{const f=M.filter(x=>x.ent.some(e=>e[0]===k&&e[1]===n)).length;g[k].push([n,f])});return g}
function memChips(m){if(!m.ent.length)return '';const g=ents(m),I={Person:'users',Topic:'hash',Project:'briefcase',Organization:'building'};
 return `<div class="r-lg b bg-card p-4 space-y-3" id="d-mem"><div class="flex ic-c gap-2 text-xs font-medium text-muted-foreground">${ic('brain',14)}<span>Memory connections</span></div>${Object.keys(g).filter(k=>g[k].length).map(k=>`<div><div class="t-10 uppercase tracking-wider text-muted-foreground flex ic-c gap-1" style="margin-bottom:6px">${ic(I[k],12)} ${k}</div><div class="flex fw gap-1_5">${g[k].map(([n,f])=>`<span class="iflex ic-c gap-1 r-full b text-xs" style="padding:2px 8px;${f>1?'background:hsl(var(--foreground)/.05);border-color:hsl(var(--foreground)/.2)':'background:hsl(var(--muted)/.5);border-color:hsl(var(--muted-foreground)/.2)'}" title="${f>1?`Appears in ${f} meetings`:'First mention'}">${esc(n)}${f>1?`<span class="t-10 text-muted-foreground">×${f}</span>`:''}</span>`).join('')}</div></div>`).join('')}</div>`}
function tagEd(m){return `<div class="space-y-2" id="d-tags"><div class="flex ic-c gap-1_5 fw">${!m.tags.length&&!S.tagEdit?'<span class="text-xs text-muted-foreground">No tags yet</span>':''}${m.tags.map(t=>{const c=tagColor(t);return `<span class="tagchip" style="background:${c.bg};border-color:${c.border};color:${c.text}">${esc(t)}<button type="button" class="opacity-60" data-a="tagrm" data-v="${esc(t)}" aria-label="Remove tag ${esc(t)}">${ic('x',12)}</button></span>`}).join('')}${!S.tagEdit&&m.tags.length<12?`<button type="button" class="dashbtn" data-a="tagadd">${ic('plus',12)} Add tag</button>`:''}</div>
 ${S.tagEdit?`<div class="rel"><div class="flex ic-c gap-2 r-md b bg-background" style="padding:6px 8px">${ic('tag',14,'text-muted-foreground')}<input id="tagin" class="f1 text-xs" style="background:transparent;outline:none" data-i="tagDraft" placeholder="tag-name and press enter" maxlength="64" value="${esc(S.tagDraft)}"></div></div>`:''}</div>`}
function dTabs(m){const t=S.tab,L=[['summary','Summary'],['transcript','Transcript'],['tasks','Tasks'+(m.tasks.length?` (${m.tasks.length})`:'')],['reminders','Reminders'+(m.rem.length?` (${m.rem.length})`:'')],['comments','Comments'+(m.comments.length?` (${m.comments.length})`:'')],['history','History']];
 return `<div class="tabs-list wfull ovx" style="justify-content:flex-start" role="tablist" id="d-tabs">${L.map(([k,l])=>`<button type="button" role="tab" class="tab" aria-selected="${t===k}" data-a="dtab" data-v="${k}">${l}</button>`).join('')}</div>`}
function transcriptBlocks(m){const f=S.tfilter.trim().toLowerCase(),us=f?m.utt.filter(u=>u.text.toLowerCase().includes(f)):m.utt;
 return us.map(u=>`<div class="r-lg b" style="padding:14px;background:hsl(var(--card)/.4)"><div class="flex gap-2 mb-1_5" style="align-items:baseline"><span class="text-xs font-medium text-muted-foreground">Speaker ${u.speaker}</span><button type="button" class="t-10 tabular text-muted-foreground lnk" style="font-variant-numeric:tabular-nums" data-a="seek" data-v="${u.start}">${fmtDur(Math.floor(u.start/1000))}</button></div><p class="text-sm leading-relaxed">${esc(u.text)}</p></div>`).join('')+(us.length===0?'<div class="text-sm text-muted-foreground">No matches.</div>':'')}
function dPane(m){const t=S.tab;
 if(t==='summary')return `<div class="prose-summary text-sm">${md(m.ver[0]&&m.ver[0].md||'_No summary yet._')}</div>`;

  return `<div class="space-y-3"><input class="wfull r-md b" style="height:2.25rem;background:transparent;padding:0 .75rem;font-size:.875rem" data-i="tfilter" id="tfilter" placeholder="Filter transcript…" value="${esc(S.tfilter)}"><div class="space-y-3" id="tblocks">${transcriptBlocks(m)}</div></div>`}

  return `<ul class="space-y-2">${m.tasks.map(k=>`<li class="r-md b bg-card p-3 flex ic-s gap-3 trans" style="${k.done?'opacity:.6':''}"><button type="button" class="r-sm b sh0 grid place-c trans" style="width:20px;height:20px;margin-top:2px;${k.done?'background:hsl(var(--foreground));color:hsl(var(--background))':''}" data-a="dtask" data-v="${k.id}" aria-label="${k.done?'Mark not done':'Mark done'}">${k.done?ic('check',12):''}</button><div class="f1 mw0"><div class="text-sm ${k.done?'line-through':''}">${esc(k.text)}</div><div class="mt-1 flex ic-c gap-3 text-xs text-muted-foreground">${k.assignee?`<span class="iflex ic-c gap-1">${ic('user',12)} ${esc(k.assignee)}</span>`:''}${k.priority?`<span class="iflex ic-c gap-1">${ic('alert-circle',12)} ${k.priority}</span>`:''}</div></div></li>`).join('')}</ul>`}
 if(t==='reminders'){if(!m.rem.length)return '<div class="text-sm text-muted-foreground">No reminders scheduled. Mention a deadline in your meeting (e.g., “by Friday”) and they\'ll appear here.</div>';
  const SM={PENDING:['Pending','info','bell'],SENT:['Sent','success','check-circle'],FAILED:['Failed','destructive','x-circle'],CANCELED:['Canceled','secondary','x']};
  return `<ul class="space-y-2">${m.rem.map(r=>{const s=SM[r.status],up=r.status==='PENDING'&&Date.parse(r.due)>NOW;return `<li class="r-md b bg-card p-3 flex ic-s gap-3"><div class="r-md bg-muted grid place-c sh0" style="width:32px;height:32px">${ic(s[2],16)}</div><div class="f1 mw0"><div class="flex ic-c gap-2 fw"><div class="text-sm font-medium">${esc(r.text)}</div><span class="badge badge-${s[1]} ml-auto sh0" style="gap:0">${s[0]}</span></div><div class="mt-1 flex ic-c gap-3 text-xs text-muted-foreground fw"><span class="iflex ic-c gap-1">${ic('calendar',12)} ${fMedium(r.due)} ${up?`<span>· ${dist(Date.parse(r.due))}</span>`:''}</span>${r.ch.includes('EMAIL')?`<span class="iflex ic-c gap-1">${ic('mail',12)} Email</span>`:''}${r.ch.includes('PUSH')?`<span class="iflex ic-c gap-1">${ic('bell',12)} Push</span>`:''}</div></div>${r.status==='PENDING'?`<button type="button" class="btn btn-ghost sz-sm" data-a="rcancel" data-v="${r.id}">Cancel</button>`:''}</li>`}).join('')}</ul>`}
 if(t==='comments')return `<div class="space-y-5">${m.comments.length?`<ul class="space-y-3">${m.comments.map(c=>`<li class="r-md b bg-card" style="padding:14px"><div class="flex ic-c jb gap-2 mb-1"><div class="text-sm font-medium">${esc(c.author)}</div><div class="text-xs text-muted-foreground">${dist(c.at)}</div></div><p class="text-sm pre-wrap leading-relaxed">${esc(c.body)}</p><div class="mt-2"><button type="button" class="btn btn-outline sz-sm" data-a="regen">${ic('refresh',14)} Regenerate from this comment</button></div></li>`).join('')}</ul>`:'<div class="text-sm text-muted-foreground">No comments yet.</div>'}
  <form class="space-y-2" data-a="cform"><textarea class="inp" rows="3" data-i="cdraft" id="cdraft" placeholder="Add a comment, suggestion, or correction…">${esc(S.cdraft)}</textarea><div class="flex je"><button type="submit" class="btn btn-default" id="cpost" ${S.cdraft.trim()?'':'disabled'}>${ic('message-circle',16)} Post comment</button></div></form></div>`;
 return m.ver.length?`<div class="space-y-2">${m.ver.map((v,i)=>{const o=(S.verOpen==null?m.ver[0].id:S.verOpen)===v.id;return `<div class="r-md b bg-card"><button type="button" class="wfull flex ic-c jb gap-3 text-left" style="padding:12px 16px" data-a="ver" data-v="${v.id}"><div class="flex ic-c gap-2">${ic('history',16,'text-muted-foreground')}<div><div class="text-sm font-medium">${i===0?'Current':'v'+(m.ver.length-i)} · ${v.trig.toLowerCase()}</div><div class="text-xs text-muted-foreground">${dist(Date.parse(v.when))} · ${esc(v.model)}</div></div></div>${ic('arrow-down',16,'text-muted-foreground')}</button>${o?`<div class="bt" style="padding:12px 16px"><div class="prose-summary text-sm">${md(v.md)}</div></div>`:''}</div>`}).join('')}</div>`:'<div class="text-sm text-muted-foreground">No summary versions yet.</div>'}
function pMeeting(){const m=byId(S.mid),inprog=m.status==='PROCESSING';

function niceTicks(max,int){if(max<=0)return int?[0,1]:[0,1];let n=4,s0=max/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),r=s0/mag,st=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*mag;if(int&&st<1)st=1;const t=[];for(let v=0;v<=Math.ceil(max/st-1e-9)*st+1e-9;v+=st)t.push(+v.toFixed(6));return t}

 ticks.forEach(t=>{s+=`<line x1="${L-6}" x2="${L}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${mc}"/><text x="${L-9}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#666">${c.fmt(t)}</text>`});
 const step=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(pw/58))));
 c.data.forEach((d,i)=>{if((n-1-i)%step===0){const x=L+band*(i+.5);s+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${T+ph}" y2="${T+ph+6}" stroke="${mc}"/><text x="${x.toFixed(1)}" y="${T+ph+20}" text-anchor="middle" font-size="11" fill="#666">${shortDay(d.day)}</text>`}});
 s+='<g id="cur"></g>';
 if(c.type==='line'){const pts=c.data.map((d,i)=>[L+band*(i+.5),y(d.v[0])]);s+=n>1?`<path d="${mono(pts)}" fill="none" stroke="${c.series[0][1]}" stroke-width="2"/>`:''}
 else c.data.forEach((d,i)=>{const bw=band*.8,x=L+band*i+band*.1;let acc=0;d.v.forEach((v,k)=>{if(v<=0)return;const y1=y(acc+v),y0=y(acc);acc+=v;const hh=y0-y1;
